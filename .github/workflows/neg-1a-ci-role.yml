name: neg-1a-ci-role

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-role:
    name: PippaHackCiRole without environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: OIDC token request
        shell: bash
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token request: available"
          else
            echo "OIDC token request: not available"
          fi

      - name: Assume PippaHackCiRole
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::780886633355:role/PippaHackCiRole
          aws-region: eu-west-2
          role-session-name: neg-1a-${{ github.run_id }}
          role-duration-seconds: 900
          disable-retry: true

      - name: Caller identity
        shell: bash
        run: aws sts get-caller-identity

  ci-role-environment:
    name: PippaHackCiRole with environment pippa-publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pippa-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: OIDC token request
        shell: bash
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token request: available"
          else
            echo "OIDC token request: not available"
          fi

      - name: Assume PippaHackCiRole
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::780886633355:role/PippaHackCiRole
          aws-region: eu-west-2
          role-session-name: neg-1a-env-${{ github.run_id }}
          role-duration-seconds: 900
          disable-retry: true

      - name: Caller identity
        shell: bash
        run: aws sts get-caller-identity
